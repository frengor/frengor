name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&show=contributions&theme_light=light_github&theme_dark=github_dark_dimmed&hide_border=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme_light=light_github&theme_dark=github_dark_dimmed&langs_count=10&hide_border=true&size_weight=0.5&count_weight=0.5&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true
      - uses: EndBug/add-and-commit@v11
        with:
          default_author: github_actions
          add: 'profile/*.svg'
          message: 'Update README cards'

