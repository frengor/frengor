name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&theme_light=light_github&theme_dark=github_dark_dimmed&hide_border=true&role=OWNER,COLLABORATOR&exclude_repo=${{ secrets.README_STATS_EXCLUDED_REPO }}
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme_light=light_github&theme_dark=github_dark_dimmed&langs_count=8&hide_border=true&size_weight=0.5&count_weight=0.5&role=OWNER,COLLABORATOR&hide=TypeScript&exclude_repo=${{ secrets.README_STATS_EXCLUDED_REPO }}
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true
      - uses: EndBug/add-and-commit@b71b8bc98e8f0c672eb1ecccfc010cd6921bec7b
        with:
          default_author: github_actions
          add: 'profile/*.svg'
          message: 'Update README cards'

